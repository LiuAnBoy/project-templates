services:
  __PART__:
    build:
      context: .
      dockerfile: __PART__/Dockerfile
      args:
        PART: __PART__
    environment:
      API_HOST: http://server:8000
    networks:
      - edge
    ports:
      - '127.0.0.1:${__PORT_VAR__:-__PORT__}:8080'
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
