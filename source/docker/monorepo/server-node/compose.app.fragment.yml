services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: '8000'
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:?set TRUST_PROXY in .env}
    networks:
      - default
      - edge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8000/api/health').then((r) => process.exit(Number(r.status !== 200)), () => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
