services:
  web:
    build: .
    environment:
      API_HOST: ${DOCKER_API_HOST:-http://host.docker.internal:8000}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:8080'
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
