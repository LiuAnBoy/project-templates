# Alembic's settings. The connection is not here: it comes from DATABASE_URL
# (see src/db/database.py), so one `.env` configures the server and the migrations.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

# Format each generated revision with the project's own formatter.
[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME
