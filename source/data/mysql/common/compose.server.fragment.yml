# How the MySQL service reaches `server` and `migrate`: the URL is fixed by the
# service name, the test URL stays out of both containers, and both wait until the
# service is healthy. The application connects as `MYSQL_USER`, not as root, so the
# root password has no use in either container and is blanked here, because
# `environment` beats the `env_file` that hands them all of `.env`.
services:
  server:
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-app}
      TEST_DATABASE_URL: ''
      MYSQL_ROOT_PASSWORD: ''
    depends_on:
      mysql:
        condition: service_healthy
  migrate:
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@mysql:3306/${MYSQL_DATABASE:-app}
      TEST_DATABASE_URL: ''
      MYSQL_ROOT_PASSWORD: ''
    depends_on:
      mysql:
        condition: service_healthy
