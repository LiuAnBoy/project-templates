# How the PostgreSQL service reaches `server` and `migrate`: the URL is fixed by
# the service name, the test URL stays out of both containers, and both wait until
# the service is healthy. The URL holds the password of the project's own database
# user, who is its administrator, so `POSTGRES_PASSWORD` is not blanked: that would
# protect nothing.
services:
  server:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DATABASE:-app}
      TEST_DATABASE_URL: ''
    depends_on:
      postgres:
        condition: service_healthy
  migrate:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DATABASE:-app}
      TEST_DATABASE_URL: ''
    depends_on:
      postgres:
        condition: service_healthy
