# How the PostgreSQL service reaches `server` and `migrate`: the URL is fixed by
# the service name, the superuser password and the test URL stay out of both
# containers (the app needs neither), and both wait until the service is healthy.
services:
  server:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DATABASE:-app}
      POSTGRES_PASSWORD: ''
      TEST_DATABASE_URL: ''
    depends_on:
      postgres:
        condition: service_healthy
  migrate:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DATABASE:-app}
      POSTGRES_PASSWORD: ''
      TEST_DATABASE_URL: ''
    depends_on:
      postgres:
        condition: service_healthy
