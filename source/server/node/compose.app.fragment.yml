services:
  server:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: '8000'
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - '127.0.0.1:${PORT:-8000}:8000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8000/api/health').then((r) => process.exit(Number(r.status !== 200)), () => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
