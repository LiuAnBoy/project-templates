# Alembic's settings. The connection is not here: it comes from DATABASE_URL
# (see src/db/database.py), so one `.env` configures the server and the migrations.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

# Make each generated revision pass the project's own lint and format checks: sort
# its imports, then format it.
[post_write_hooks]
hooks = imports, format
imports.type = exec
imports.executable = ruff
imports.options = check --fix --select I REVISION_SCRIPT_FILENAME
format.type = exec
format.executable = ruff
format.options = format REVISION_SCRIPT_FILENAME
