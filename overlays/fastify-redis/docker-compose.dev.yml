# Development services for this project. The credentials are fake and for
# local development only; never reuse them anywhere else.
# Start:               docker compose -f docker-compose.dev.yml up -d --wait
# Stop:                docker compose -f docker-compose.dev.yml down
# Stop and drop data:  docker compose -f docker-compose.dev.yml down -v
# Compose reads .env in this directory for the values below; copy
# .env.example to .env first.

services:
  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
